services:
  - type: web
    name: voiceshield
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/download_aasist.py
    startCommand: uvicorn app.api:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VOICESHIELD_ENABLE_PRIVATE_REPORTS
        value: "false"
